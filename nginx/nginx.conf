server {
    listen 80;
    # Chuyển HTTP sang HTTPS (giữ đúng cổng public 8443 do host map 8443->443)
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name vicemhatien.com.vn *.vicemhatien.com.vn 172.16.1.246 localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/vicemhatien.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy toàn bộ request sang app container
    location / {
        proxy_pass         http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Hỗ trợ upload ảnh lớn (4MB limit của app)
        client_max_body_size 10m;
    }
}
