# Triển khai ATLĐ VICEM Hà Tiên — chỉ đóng gói app, kết nối Postgres vicem_cms có sẵn.
# DB chạy ngoài container (trên host hoặc máy chủ khác). App chỉ dùng schema atld,
# KHÔNG đụng tới schema public (23 bảng CMS sẵn có).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: atld-vicem:latest
    container_name: atld-app
    restart: unless-stopped
    # Không expose ra host nữa — nginx proxy nội bộ qua mạng docker.
    expose:
      - "4000"
    env_file:
      - .env.docker
    # Cho phép container gọi tới Postgres đang chạy trên host (Windows/Mac Docker Desktop).
    # Trên Linux, thêm network_mode: host hoặc dùng IP host thật trong PGHOST.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Giữ ảnh nhận diện & ảnh nội dung qua các lần rebuild
      - atld-uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reverse proxy HTTPS (self-signed cert) cho truy cập LAN qua https://<IP>
  nginx:
    image: nginx:1.27-alpine
    container_name: atld-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Cổng chuẩn 80/443 để truy cập https://atld.vicemhatien.com.vn/ không cần :8443.
      # Hardcode để .env (HTTP_PORT/HTTPS_PORT) không ghi đè cổng public chuẩn.
      - "80:80"
      - "443:443"
      # Giữ 8080/8443 cho tương thích ngược (bookmark/URL cũ).
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  atld-uploads:
